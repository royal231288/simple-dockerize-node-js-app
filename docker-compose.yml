version: "3.8"

services:

  app:
    image: royal794/node-app:1.0
    container_name: express_app
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
